# OpsPilot TLS reverse-proxy reference (Nginx).
#
# Terminates TLS 1.2/1.3 for the Web UI and Hub API and upgrades WebSocket traffic for the
# agent control socket at /api/agents/connect (wss://). Hub, Worker and Postgres stay on the
# internal Compose network; only this proxy is published. See compose.tls.yaml.
#
# Mount this file at /etc/nginx/templates/opspilot.conf.template inside the official
# nginx container (so envsubst substitutes ${OPSPILOT_DOMAIN} at startup into
# /etc/nginx/conf.d/opspilot.conf) and set OPSPILOT_DOMAIN in the environment
# (default: localhost). Certificate paths assume the files are mounted at /etc/nginx/certs/.

upstream opspilot_web {
    server web:3000;
}

upstream opspilot_hub {
    server hub:3001;
}

# Upgrade/Connection header plumbing shared by all websocket locations.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${OPSPILOT_DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:opspilot_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern, conservative defaults; HSTS only once the domain is confirmed public.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    # Agent control socket: direct to Hub with websocket upgrade headers.
    location = /api/agents/connect {
        proxy_pass http://opspilot_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else (Web UI incl. its /api/* rewrite to the Hub) goes to Web.
    location / {
        proxy_pass http://opspilot_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Redirect plain HTTP to HTTPS when the deployment is public.
server {
    listen 80;
    listen [::]:80;
    server_name ${OPSPILOT_DOMAIN};
    return 301 https://$host$request_uri;
}
