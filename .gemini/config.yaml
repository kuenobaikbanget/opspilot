have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: LOW
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
ignore_patterns:
  - "bun.lock"
  - "bun.lockb"
  - "agent/go.sum"
  - "node_modules/**"
  - "**/node_modules/**"
  - "agent/vendor/**"
  - ".next/**"
  - "**/.next/**"
  - "dist/**"
  - "**/dist/**"
  - "coverage/**"
  - "**/coverage/**"
  - "agent/bin/**"
  - "**/*.tsbuildinfo"
  - "**/*.exe"
  - "**/*.testout"
  - "**/*.log"
  - "apps/web/next-env.d.ts"
  - ".impeccable/review/**"
  - ".impeccable/config.local.json"
