name: Release — Versioned binaries & images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag and main ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require a strict v-prefixed SemVer tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo '::error::Expected vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix; build metadata is not supported.'
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
            IFS='.' read -r -a identifiers <<< "${version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" =~ ^0[0-9]+$ ]]; then
                echo '::error::Numeric prerelease identifiers must not contain leading zeroes.'
                exit 1
              fi
            done
          fi
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check out tag and complete branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag commit to be contained in origin/main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify refs/remotes/origin/main
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse --verify 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo '::error::Release tags must point to a commit contained in origin/main.'
            exit 1
          fi

  checks:
    name: Run release quality gate
    needs: validate
    uses: ./.github/workflows/checks.yml

  binaries:
    name: Build Linux ${{ matrix.arch }} agent archive
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out validated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from the agent module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build a static agent and package installation templates
        working-directory: agent
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/opspilot-agent-linux-$GOARCH"
          mkdir -p "$staging"
          go build -mod=readonly -trimpath -ldflags='-s -w' -o "$staging/opspilot-agent" ./cmd/opspilot-agent
          install -m 0644 ../infra/systemd/opspilot-agent.service "$staging/opspilot-agent.service"
          install -m 0644 ../infra/systemd/agent.env.example "$staging/agent.env.example"
          tar -czf "$RUNNER_TEMP/opspilot-agent_${VERSION}_linux_${GOARCH}.tar.gz" \
            -C "$staging" opspilot-agent opspilot-agent.service agent.env.example
      - name: Upload the versioned agent archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opspilot-agent-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/opspilot-agent_${{ needs.validate.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Publish versioned container packages
    needs: [validate, checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish GitHub Release after binaries and packages
    needs: [validate, binaries, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the Linux amd64 agent archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opspilot-agent-linux-amd64
          path: ${{ runner.temp }}/release
      - name: Download the Linux arm64 agent archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opspilot-agent-linux-arm64
          path: ${{ runner.temp }}/release
      - name: Generate checksums and create the GitHub Release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          archives=("opspilot-agent_${VERSION}_linux_amd64.tar.gz" "opspilot-agent_${VERSION}_linux_arm64.tar.gz")
          sha256sum "${archives[@]}" > SHA256SUMS
          release_flags=(--latest=true)
          if [[ "$PRERELEASE" == true ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "OpsPilot $RELEASE_TAG" "${release_flags[@]}" \
            "${archives[@]}" SHA256SUMS
